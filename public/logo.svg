<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 84" fill="none">
  <defs>
    <linearGradient id="bearGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>
    <linearGradient id="earGrad" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0" y1="0" x2="16" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-4" y="-2" width="76" height="76" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF5722" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Mascot: Playful Teddy Bear -->
  <g transform="translate(10, 10)">
    <!-- Ears -->
    <circle cx="16" cy="16" r="13" fill="url(#bearGrad)"/>
    <circle cx="16" cy="16" r="7" fill="url(#earGrad)"/>
    <circle cx="48" cy="16" r="13" fill="url(#bearGrad)"/>
    <circle cx="48" cy="16" r="7" fill="url(#earGrad)"/>

    <!-- Head -->
    <rect x="6" y="10" width="52" height="48" rx="24" fill="url(#bearGrad)" filter="url(#shadow)"/>

    <!-- Snout / Muzzle -->
    <ellipse cx="32" cy="38" rx="14" ry="11" fill="#FFFFFF"/>
    <!-- Nose -->
    <path d="M28 34 C28 32, 36 32, 36 34 C36 37, 32 39, 32 39 C32 39, 28 37, 28 34 Z" fill="#0F172A"/>
    <!-- Mouth -->
    <path d="M32 38.5 L32 42 M28.5 41 C29.5 43.5, 34.5 43.5, 35.5 41" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Eyes with cute catchlights -->
    <circle cx="23" cy="28" r="3.5" fill="#0F172A"/>
    <circle cx="22" cy="26.8" r="1.3" fill="#FFFFFF"/>
    <circle cx="41" cy="28" r="3.5" fill="#0F172A"/>
    <circle cx="40" cy="26.8" r="1.3" fill="#FFFFFF"/>

    <!-- Cute Blush cheeks -->
    <ellipse cx="16" cy="36" rx="4" ry="2.5" fill="#FFA291" opacity="0.8"/>
    <ellipse cx="48" cy="36" rx="4" ry="2.5" fill="#FFA291" opacity="0.8"/>

    <!-- Sparkle Star -->
    <path d="M56 6 L58 11 L63 13 L58 15 L56 20 L54 15 L49 13 L54 11 Z" fill="url(#starGrad)"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(86, 44)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" letter-spacing="-0.5">
      <tspan fill="#0F172A">Trendy</tspan><tspan fill="#FF5722">Toyz</tspan>
    </text>
    <text y="20" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" fill="#64748B" letter-spacing="2.2">
      INDIA'S PLAYFUL TOY STORE
    </text>
  </g>
</svg>
