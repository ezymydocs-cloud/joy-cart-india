<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favBear" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>
    <linearGradient id="favEar" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="favStar" x1="0" y1="0" x2="16" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#0F172A"/>

  <!-- Ears -->
  <circle cx="20" cy="20" r="11" fill="url(#favBear)"/>
  <circle cx="20" cy="20" r="6" fill="url(#favEar)"/>
  <circle cx="44" cy="20" r="11" fill="url(#favBear)"/>
  <circle cx="44" cy="20" r="6" fill="url(#favEar)"/>

  <!-- Head -->
  <rect x="11" y="15" width="42" height="40" rx="20" fill="url(#favBear)"/>

  <!-- Snout / Muzzle -->
  <ellipse cx="32" cy="38" rx="12" ry="9" fill="#FFFFFF"/>
  <path d="M28.5 35 C28.5 33, 35.5 33, 35.5 35 C35.5 37.5, 32 39, 32 39 C32 39, 28.5 37.5, 28.5 35 Z" fill="#0F172A"/>
  <path d="M32 38.5 L32 41 M29 40 C30 42, 34 42, 35 40" stroke="#0F172A" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="24" cy="29" r="3" fill="#0F172A"/>
  <circle cx="23.2" cy="28" r="1" fill="#FFFFFF"/>
  <circle cx="40" cy="29" r="3" fill="#0F172A"/>
  <circle cx="39.2" cy="28" r="1" fill="#FFFFFF"/>

  <!-- Cheeks -->
  <ellipse cx="18" cy="36" rx="3.5" ry="2" fill="#FFA291" opacity="0.8"/>
  <ellipse cx="46" cy="36" rx="3.5" ry="2" fill="#FFA291" opacity="0.8"/>

  <!-- Sparkle Star -->
  <path d="M52 8 L53.5 12 L57.5 13.5 L53.5 15 L52 19 L50.5 15 L46.5 13.5 L50.5 12 Z" fill="url(#favStar)"/>
</svg>
